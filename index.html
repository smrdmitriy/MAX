:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif;color:#1d1d1f;background:#f5f5f7;font-synthesis:none}*{box-sizing:border-box}body{margin:0;overflow:hidden}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #007aff;outline-offset:3px}.app{height:100dvh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 83% 18%,#e5efff 0%,transparent 34%),#f5f5f7}.top{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,3vw,48px);gap:12px;flex-shrink:0}.brand{font-size:14px;font-weight:760;letter-spacing:-.03em}.brand span{color:#007aff}.topright{display:flex;align-items:center;gap:9px}.pill{border:1px solid #dfe2e8;border-radius:100px;background:#fff9;padding:9px 13px;font-size:12px;font-weight:650;color:#42434a}.iconbtn{width:38px;height:38px;border:1px solid #e4e5eb;background:white;border-radius:13px;color:#3c3c43}.stage{flex:1;min-height:0;padding:0 clamp(10px,2.5vw,42px) 12px;display:flex;justify-content:center;align-items:center}.slide{width:min(100%,calc((100dvh - 200px)*1.7778));height:100%;max-height:calc((100vw - 20px)/1.7778);aspect-ratio:16/9;background:white;box-shadow:0 24px 90px #16254115,0 2px 10px #1524400a;border-radius:clamp(16px,2.2vw,32px);position:relative;overflow:hidden;isolation:isolate;display:flex;flex-direction:column;padding:clamp(20px,3vw,52px) clamp(22px,4vw,70px);transition:opacity .34s,transform .5s cubic-bezier(.2,.8,.2,1);container-type:size}.slide.enter{animation:slideIn .58s cubic-bezier(.16,1,.3,1)}@keyframes slideIn{from{opacity:.2;transform:translateX(36px) scale(.975);filter:blur(5px)}to{opacity:1;transform:none;filter:none}}.slide.reverse{animation:slideBack .48s ease-out}@keyframes slideBack{from{opacity:.2;transform:translateX(-35px) scale(.975)}to{opacity:1;transform:none}}.slide::before{content:"";position:absolute;width:50%;aspect-ratio:1;right:-17%;top:-45%;background:radial-gradient(circle,var(--wash),t tent:space-between;gap:12px}.ctrlgroup{display:flex;align-items:center;gap:7px}.navbtn{border:1px solid #e4e5ea;background:white;border-radius:12px;padding:7px 12px;font-size:12px;font-weight:700}.navbtn.primary{background:#1d1d1f;color:white}.progress{height:4px;background:#e9ebf0;border-radius:5px;overflow:hidden;flex:1;max-width:340px}.progress>div{height:100%;background:#007aff;transition:width .4s}.ribbon{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;scrollbar-color:#c9ced8 transparent;scroll-snap-type:x proximity;padding:2px 0 6px}.thumb{border:1px solid #e5e7ec;border-radius:10px;background:#f7f8fa;color:#777;font-size:11px;min-width:56px;height:38px;flex:0 0 56px;font-weight:800;position:relative;scroll-snap-align:center;transition:.2s}.thumb.active{background:#1d1d1f;color:white;transform:translateY(-1px);box-shadow:0 3px 9px #1112}.thumb::before{content:"";position:absolute;top:0;left:8px;right:8px;height:3px;background:var(--thumb-accent);border-radius:0 0 4px 4px}.thumb:hover{border-color:#007aff}.overview{position:fixed;inset:0;background:#f5f5f7f7;z-index:10;backdrop-filter:blur(15px);padding:35px;overflow:auto;display:none}.overview.open{display:block}.ovgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:15px}.ovcard{background:white;border:1px solid #e5e6ea;border-radius:17px;padding:18px;text-align:left;min-height:135px;box-shadow:0 6px 20px #17223b08}.ovcard b{font-size:13px;color:#007aff}.ovcard p{font-size:17px;font-weight:730;letter-spacing:-.025em}.ovhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.ovhead h2{font-size:30px;letter-spacing:-.05em;margin:0}.help{font-size:11px;color:#85858d}.hint{font-size:11px;color:#666}.fadeup{animation:reveal .65s ease both}.fadeup:nth-child(2){animation-delay:.1s}.fadeup:nth-child(3){animation-delay:.18s}.fadeup:nth-child(4){animation-delay:.26s}@media(max-width:750px){.top{height:54px}.top .pill{display:none}.sta const DATA=[{"type": "intro", "text": "Физика в 10–11 классах: нестандартные задачи, эксперименты и исследовательское мышление", "id": 1, "title": "От базового к углублённому уровню", "time": 1}, {"type": "concept", "idea": "Базовый: распознать модель и применить закон. Углублённый: выбрать модель, проверить допущения и объяснить результат.", "activity": "Пример: «найти силу трения» → «проверить экспериментально, как Fтр зависит от N».", "teacher": "Сравниваем не количество формул, а самостоятельность ученика.", "id": 2, "title": "Два уровня — два типа учебных действий", "time": 2}, {"type": "concept", "idea": "Одна ситуация может содержать несколько уровней исследовательской деятельности.", "activity": "1. Стандартный расчёт. 2. Изменение параметра. 3. Ограничение применимости. 4. Обратная задача. 5. Экспериментальная проверка.", "teacher": "Сложность создаёт выбор стратегии, а не громоздкая арифметика.", "id": 3, "title": "Как усложнить задачу методически", "time": 2}, {"type": "concept", "idea": "Ускорение вагона меняет положение равновесия подвешенного груза.", "activity": "Попросите объяснить явление из системы Земли и из системы вагона.", "teacher": "Не смешивать силы взаимодействия и силы инерции. a →", "id": 4, "title": "Почему маятник отклоняется в вагоне?", "time": 2}, {"type": "concept", "idea": "В системе вагона вводится сила инерции Fин = −ma, направленная против ускорения системы.", "activity": "Эффективное ускорение gэфф = g − aсистемы (векторно). Важно различать поступательное и вращательное движение системы.", "teacher": "Сначала выбрать систему отсчёта, затем рисовать силы. a →", "id": 5, "title": "Инерциальная и неинерциальная системы", "time": 2}, {"type": "task", "condition": "Маятник длиной l находится в лифте с ускорением a вверх или вниз. Найти период малых колебаний.", "steps": ["В системе лифта gэфф = g + a (вверх) или g − a (вниз).", "Для малых углов возвращающая сила ≈ −mgэфф·x/l.", "Получаем ω² = gэфф/l; исследуем случай a → g при движении вниз."], "result": "T = 2π√(l/gэфф); при свободном падении обычная модель маятника теряет применимость.", "teacher": "Обсудить границы модели малых колебаний.", "id": 6, "title": "Задача 1. Маятник в лифте", "time": 2}, {"type": "task", "condition": "Гладкая наклонная плоскость под углом α движется горизонтально. При каком ускорении брусок покоится относительно неё?", "steps": ["В системе тележки действуют mg, N и Fин = −ma.", "Проекция вдоль плоскости: mg sinα = ma cosα (при подходящем направлении a).", "Добавление трения: |mg sinα − ma cosα| ≤ μN."], "result": "Без трения: a = g tgα. С трением возникает диапазон ускорений.", "teacher": "Сравнить решение в двух системах отсчёта.", "id": 7, "title": "Задача 2. Брусок на ускоряющейся тележке", "time": 2}, {"type": "concept", "idea": "Частая ошибка — записывать силу инерции в инерциальной системе вместе с реальными силами.", "activity": "Мини-тест: три рисунка сил, один верный. Ученики объясняют, где находится наблюдатель.", "teacher": "Требовать подпись системы отсчёта на каждом рисунке.", "id": 8, "title": "Диагностика ошибок: неинерциальные системы", "time": 1}, {"type": "concept", "idea": "Закон обратных квадратов: F = GmM/r², g(r) = GM/r².", "activity": "Сравните g на поверхности и на высоте R над поверхностью: g(2R)=g(R)/4.", "teacher": "Предложить оценить ответ до вычислений. rₚ rₐ", "id": 9, "title": "Тяготение: как меняется поле с высотой?", "time": 2}, {"type": "concept", "idea": "Второй закон Кеплера связан с сохранением момента импульса при центральной силе.", "activity": "Для эллиптической орбиты скорость больше в перицентре и меньше в апоцентре.", "teacher": "Не путать равные площади и равные расстояния. rₚ rₐ", "id": 10, "title": "Законы Кеплера как инструмент анализа", "time": 2}, {"type": "task", "condition": "rп = 7000 км, rа = 14000 км. Определить отношение скоростей спутника в этих точках.", "steps": ["В перицентре и апоцентре скорость перпендикулярна радиус-вектору.", "Момент импульса сохраняется: mrпvп = mrаvа.", "Сокращаем массу, подставляем радиусы."], "result": "vп/vа = rа/rп = 2.", "teacher": "Обсудить, почему нельзя использовать v = √(GM/r) для эллипса.", "id": 11, "title": "Задача 3. Скорости на эллиптической орбите", "time": 2}, {"type": "task", "condition": "Радиус круговой орбиты увеличен в 4 раза. Как изменятся орбитальная скорость, период и механическая энергия?", "steps": ["Для круговой орбиты v = √(GM/r).", "По третьему закону Кеплера T² ∝ r³.", "Полная энергия E = −GMm/(2r)."], "result": "v₂=v₁/2; T₂=8T₁; E₂=E₁/4 (энергия отрицательна).", "teacher": "Разделить сравнение конечных орбит и реальный манёвр перехода.", "id": 12, "title": "Задача 4. Две круговые орбиты", "time": 2}, {"type": "concept", "idea": "Углублённый уровень требует связывать законы тяготения, энергии и движения.", "activity": "Приёмы: обратная задача по периоду спутника; проверка размерности; анализ предельных значений.", "teacher": "Показывать ограничения модели материальных точек.", "id": 13, "title": "Тяготение: от вычисления к моделированию", "time": 1}, {"type": "concept", "idea": "Разность давлений на верхнюю и нижнюю поверхности порождает результирующую вверх.", "activity": "Демонстрация: динамометр, груз и сосуд с водой; затем вопрос о форме тела.", "teacher": "Разделять силу давления на поверхность и результирующую силу. p = ρgh", "id": 14, "title": "Архимедова сила: откуда она берётся?", "time": 2}, {"type": "concept", "idea": "p = p₀ + ρgh; распределение давления линейно по глубине в однородной жидкости.", "activity": "Построить p(h), объяснить, почему сила на вертикальный щит не равна pдна·S.", "teacher": "Использовать график как средство вычисления. p = ρgh", "id": 15, "title": "Гидростатическое давление как функция", "time": 2}, {"type": "task", "condition": "Тело плотности ρ находится в равновесии на границе жидкостей ρ₁ < ρ < ρ₂. Найти долю объёма в нижней жидкости.", "steps": ["Пусть V₂ = xV, V₁ = (1−x)V.", "Условие плавания: ρgV = ρ₁g(1−x)V + ρ₂gxV.", "Выразим x и проверим 0 ≤ x ≤ 1."], "result": "x = (ρ−ρ₁)/(ρ₂−ρ₁).", "teacher": "Предложить ученикам самим определить физически допустимые плотности.", "id": 16, "title": "Задача 5. Тело между двумя жидкостями", "time": 2}, {"type": "task", "condition": "Прямоугольный щит шириной b и высотой H начинается у свободной поверхности жидкости. Найти силу и глубину центра давления.", "steps": ["Давление меняется линейно: p(h)=ρgh.", "Интегрирование / площадь треугольника: F=ρgbH²/2.", "Момент распределённой силы даёт hц = 2H/3."], "result": "F = ρgbH²/2; hц = 2H/3.", "teacher": "Для подготовленного класса — интеграл; для остальных — графический метод.", "id": 17, "title": "Задача 6. Давление на вертикальный щит", "time": 2}, {"type": "concept", "idea": "Расчёт давления → сила на поверхность → центр давления и устойчивость конструкции.", "activity": "Попросить определить, какие данные необходимы для инженерной проверки стенки резервуара.", "teacher": "Углубление через физический смысл, не только формулу.", "id": 18, "title": "Гидростатика: три уровня одной задачи", "time": 1}, {"type": "concept", "idea": "Момент зависит от плеча и направления силы. Центр масс определяет точку приложения равнодействующей тяжести в однородном поле.", "activity": "Демонстрация линейки с грузами: смещаем груз, измеряем плечи, обсуждаем устойчивость.", "teacher": "Проверить, различают ли плечо силы и расстояние до точки приложения. mg ↓", "id": 19, "title": "Момент силы и центр масс", "time": 2}, {"type": "concept", "idea": "ΣF = 0 исключает поступательное ускорение; ΣM = 0 исключает угловое ускорение.", "activity": "Составить свободную диаграмму сил и выбрать удобную ось моментов.", "teacher": "Ось моментов можно выбрать произвольно; рациональный выбор сокращает расчёт. mg ↓", "id": 20, "title": "Два условия равновесия", "time": 2}, {"type": "task", "condition": "Однородная лестница под углом α опирается на гладкую стену и шероховатый пол. Найти μmin.", "steps": ["По вертикали: N=mg; по горизонтал function graphic(i){let kind=visualKinds[i]||(['atom','orbit','energy','circuit'][group(i-1)]);const S=(body)=>`<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Анимированная физическая схема"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#007aff"/><stop offset="1" stop-color="#af52de"/></linearGradient></defs>${body}</svg>`;
const line=(d,c='#007aff',w=5,cls='')=>`<path d="${d}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" fill="none" class="${cls}"/>`;
if(kind==='pendulum')return S(`<path d="M100 65H400" stroke="#b5becd" stroke-width="8" stroke-linecap="round"/><path d="M250 65V300" stroke="#b5becd" stroke-width="2" stroke-dasharray="8 9"/><g style="transform-origin:250px 65px;animation:swing 3s ease-in-out infinite alternate">${line('M250 65L330 265','#007aff',7)}<circle cx="330" cy="265" r="25" fill="url(#g)"/></g><text x="72" y="310" fill="#637085" font-size="20">a →</text>${line('M75 320H180','#af52de',4)}<style>@keyframes swing{from{transform:rotate(-30deg)}to{transform:rotate(12deg)}}</style>`);
if(kind==='ramp')return S(`${line('M90 280L390 280L390 100Z','#a3b4ca',5)}<path d="M90 280L390 100L390 280Z" fill="#cfe4ff" opacity=".8"/><g class="moving" transform="rotate(-31 275 172)"><rect x="246" y="146" width="65" height="50" rx="8" fill="url(#g)"/></g>${line('M170 315H340','#007aff',6)}<text x="345" y="323" fill="#007aff" font-size="24">a</text>`);
if(kind==='orbit'||kind==='gravity')return S(`<ellipse cx="250" cy="175" rx="185" ry="108" stroke="#9bb8ef" stroke-width="3" fill="none" stroke-dasharray="7 8"/><circle cx="180" cy="175" r="35" fill="url(#g)"/><g class="spin"><circle cx="435" cy="175" r="13" fill="#ff9500"/><circle cx="435" cy="175" r="23" stroke="#ff9500" opacity=".25" fill="none"/></g><text x="165" y="240" fill="#7b8496" font-size="17">M</text>`);
if(kind==='fluid')return S(`<rect x="115" y="75" width="275" height="230" rx="13" fill="#d8eaff" opacity=".8"/><path d="M115 150Q180 135 250 150T390 150" fill="none" stroke="#007aff" stroke-width="5" class="wave"/><rect x="218" y="140" width="70" height="110" rx="13" fill="#af52de" opacity=".8" class="moving"/>${line('M255 260V190','#00a67e',6)}<text x="275" y="226" fill="#00a67e" font-size="20">Fₐ</text>${line('M335 90V145','#ff9500',5)}<text x="343" y="117" fill="#ff9500" font-size="20">g</text>`);
if(kind==='lever'||kind==='ladder')return S(kind==='ladder'?`${line('M85 300H430','#94a3b8',7)}${line('M430 50V300','#94a3b8',7)}${line('M160 300L430 75','#007aff',13)}<circle cx="160" cy="300" r="9" fill="#ff9500"/>${line('M290 190V265','#ff9500',5)}<text x="306" y="251" fill="#ff9500" font-size="20">mg</text>`:`${line('M70 185H430','#007aff',14)}<path d="M250 193L216 270H284Z" fill="#a8b4c9"/><rect x="130" y="135" width="58" height="42" rx="9" fill="#ff9500" class="moving"/><rect x="330" y="125" width="58" height="52" rx="9" fill="#af52de" class="moving"/>`);
if(kind==='plate')return S(`<rect x="110" y="65" width="280" height="220" rx="12" fill="#a5cfff"/><circle cx="300" cy="170" r="60" fill="#edf4ff"/><circle cx="221" cy="175" r="10" fill="#ff9500"/><text x="180" y="320" font-size="19" fill="#667">центр масс</text>`);
if(kind==='friction')return S(`${line('M60 280H440','#9ba7ba',8)}<rect x="185" y="180" width="135" height="94" rx="16" fill="url(#g)" class="moving"/>${line('M325 226H430','#ff9500',6)}${line('M185 245H90','#00a67e',6)}<text x="335" y="207" fill="#ff9500" font-size="20">F</text>`);
if(kind==='osc'||kind==='energy'||kind==='resonance'){let paths='';for(let j=0;j<240;j++){let x=25+j*1.85, y=175-90*Math.sin(j/18)*(kind==='resonance'?Math.exp(-Math.pow((j-125)/85,2)):1);paths+=(j?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)+' ';}return S(`${line('M25 175H475','#9aa7bb',2)}${line('M45 35V310','#9aa7bb',2)}<path d="${paths}" stroke="url(#g)" stroke-width="6" fill="none" class="wave"/><circle cx="285" cy="${(175-90*Math.sin(140/18)).toFixed(1)}" r="9" fill="#ff9500" class="pulse"/><text x="442" y="200" fill="#65728a" font-size="19">t / f</text>`)}
if(kind==='circuit'||kind==='transformer')return S(`${line('M100 80H395V265H100V80','#7187a6',5)}<path d="M100 145q-40 0 0 25q40 0 0 25q-40 0 0 25" stroke="#007aff" stroke-width="6" fill="none"/><path d="M260 80v-25m22 0v50m-22-25h-40m62 0h40" stroke="#af52de" stroke-width="6" fill="none"/><rect x="225" y="248" width="70" height="35" rx="5" fill="#ff9500"/><circle cx="390" cy="170" r="22" fill="#d8eaff" stroke="#007aff" stroke-width="4" class="pulse"/><text x="375" y="178" font-size="22" fill="#007aff">~</text>`);
return S(`<g class="spin"><circle cx="250" cy="175" r="112" stroke="#007aff" stroke-width="4" fill="none"/><ellipse cx="250" cy="175" rx="150" ry="55" transform="rotate(50 250 175)" stroke="#af52de" stroke-width="4" fill="none"/><ellipse cx="250" cy="175" rx="150" ry="55" transform="rotate(-50 250 175)" stroke="#ff9500" stroke-width="4" fill="none"/></g><circle cx="250" cy="175" r="19" fill="#007aff"/>`)}
function render(){const d=DATA[current],g=group(current);document.getElementById('topic').textContent=['Методика преподавания','10 класс · Механика','11 класс · Колебания и электричество','Методический практикум'][g];document.getElementById('clock').textContent=`${d.time} мин · 90 минут всего`;document.getElementById('counter').textContent=`${String(current+1).padStart(2,'0')} / 50`;document.getElementById('progress').style.width=`${(current+1)/50*100}%`;let h=`<div class="eyebrow fadeup">${d.type==='task'?'Практикум · пошаговое решение':g===1?'10 класс · механика':g===2?'11 класс · колебания и электричество':'Методический мастер-класс'}</div><h1 class="fadeup ${d.type==='intro'?'large':''}">${esc(d.title)}</h1>`;
if(d.type==='task'){let steps=d.steps.slice(0,revealed).map((s,i)=>`<div class="stepcard" style="animation-delay:${i*.07}s"><span class="stepnum">${i+1}</span><span>${esc(s)}</span></div>`).join('');h+=`<div class="content"><div class="left"><div class="panel fadeup"><div class="kicker">01 / Условие</div><div class="bodytext">${esc(d.condition)}</div></div><div class="panel white" style="flex:1;overflow:auto"><div class="kicker">02 / Построение модели и решение</div><div style="display:flex;flex-direction:column;gap:9px">${steps||'<div class="smalltext">Нажмите «Далее» или пробел, чтобы раскрыть решение.</div>'}</div></div>${revealed>=d.steps.length?`<div class="result"><strong>Результат</strong><br>${esc(d.result)}</div>`:`<button class="stepbtn" onclick="next()">${revealed?'Следующий шаг':'Начать решение'} →</button>`}</div><div style="display:flex;flex-direction:column;gap:12px;min-height:0"><div class="viz" style="flex:1">${graphic(d.id)}</div><div class="method"><div class="kicker">Учителю</div><div class="smalltext">${esc(d.teacher)}</div></div></div></div>`}
else if(d.type==='concept'){h+=`<div class="content"><div class="left"><div class="panel fadeup"><div class="kicker">Физическая идея</div><div class="bodytext">${esc(d.idea)}</div></div><div class="panel white fadeup"><div class="kicker">Разбор / деятельность</div><div class="bodytext">${esc(d.activity)}</div></div><div class="method fadeup"><div class="kicker">Методический акцент</div><div class="bodytext">${esc(d.teacher)}</div></div></div><div class="viz fadeup">${graphic(d.id)}</div></div>`}
else{h+=`<div class="heroContent"><div class="heroDesc fadeup">${esc(d.text||'Физические модели, нестандартные задачи и исследовательское мышление.')}</div><div class="heroChips fadeup"><span>10–11 классы</span><span>Базовый ↔ углублённый</span><span>90 минут</span></div></div><div class="heroGraphic">${graphic(d.id)}</div>`}
h+=`<div class="slidefoot"><span>ГБОУ СОШ «ОЦ «Южный город»</span><span>${String(d.id).padStart(2,'0')} / 50</span></div>`;const el=document.getElementById('slide');el.style.setProperty('--accent',colors[g]);el.style.setProperty('--wash',washes[g]);el.className='slide '+(reverse?'reverse':'enter');el.innerHTML=h;document.querySelectorAll('.thumb').forEach((b,i)=>b.classList.toggle('active',i===current));document.querySelector('.thumb.active')?.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});document.getElementById('nextBtn').textContent=d.type==='task'&&revealed<d.steps.length?'Следующий шаг →':'Далее →';history.replaceState(null,'','#slide-'+(current+1));}
function go(i){if(i<0||i>=DATA.length)return;reverse=i<current;current=i;revealed=0;render()}function next(){const d=DATA[current];if(d.type==='task'&&revealed<d.steps.length){revealed++;render();return}go(Math.min(49,current+1))}function revealAll(){if(DATA[current].type==='task'){revealed=DATA[current].steps.length;render()}}function overview(open){document.getElementById('overview').classList.toggle('open',open)}function full(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()}
const ribbon=document.getElementById('ribbon'),ovgrid=document.getElementById('ovgrid');DATA.forEach((d,i)=>{const b=document.createElement('button');b.className='thumb';b.style.setProperty('--thumb-accent',colors[group(i)]);b.textContent=String(i+1).padStart(2,'0');b.title=`${i+1}. ${d.title}`;b.onclick=()=>go(i);ribbon.appendChild(b);const c=document.createElement('button');c.className='ovcard';c.innerHTML=`<b>${String(i+1).padStart(2,'0')} · ${d.time} мин</b><p>${esc(d.title)}</p>`;c.onclick=()=>{overview(false);go(i)};ovgrid.appendChild(c)});document.addEventListener('keydown',e=>{if(document.getElementById('overview').classList.contains('open')){if(e.key==='Escape')overview(false);return}if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();next()}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}if(e.key.toLowerCase()==='o')overview(true);if(e.key.toLowerCase()==='f')full();if(e.key==='Home')go(0);if(e.key==='End')go(49)});let touchX=0;document.querySelector('.stage').addEventListener('touchstart',e=>{touchX=e.changedTouches[0].screenX},{passive:true});document.querySelector('.stage').addEventListener('touchend',e=>{let delta=e.changedTouches[0].screenX-touchX;if(Math.abs(delta)>70)delta<0?next():go(current-1)},{passive:true});const hash=Number(location.hash.replace('#slide-',''));current=hash>=1&&hash<=50?hash-1:0;render();
</script></body></html>
