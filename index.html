<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Зинков Максим</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif;overflow:hidden}.app{height:100dvh;display:flex;flex-direction:column;background:radial-gradient(ellipse at 75% 0,#dceaff,transparent 40%),#f5f5f7}.top{height:68px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 3vw}.brand{font-weight:800;letter-spacing:-.05em;font-size:20px}.brand b{color:#007aff}.info{font-size:13px;color:#6e6e73}.stage{min-height:0;flex:1;display:flex;align-items:center;justify-content:center;padding:5px 3vw 12px}.slide{position:relative;overflow:hidden;width:min(100%,calc((100dvh - 210px)*1.777));aspect-ratio:16/9;background:#fff;border-radius:32px;box-shadow:0 22px 85px #2233541c;padding:3.4% 4%;display:flex;flex-direction:column}.slide.in{animation:enter .6s cubic-bezier(.2,.8,.2,1)}@keyframes enter{from{opacity:.15;transform:translateY(26px) scale(.975);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}.over{font-size:clamp(11px,1.3vw,17px);font-weight:800;color:#007aff;letter-spacing:.13em}.title{font-size:clamp(26px,3.2vw,53px);line-height:1.06;letter-spacing:-.05em;margin:12px 0 4px;max-width:95%}.body{flex:1;min-height:0;display:grid;grid-template-columns:.9fr 1.4fr;align-items:center;gap:2.5%}.formulas{display:flex;flex-direction:column;gap:13px}.formula{background:#f5f7fa;border:1px solid #e9edf2;padding:18px 20px;border-radius:23px;font-size:clamp(21px,2.5vw,43px);font-weight:700;letter-spacing:-.035em;overflow-wrap:anywhere;animation:pop .65s both}.formula:nth-child(2){animation-delay:.2s}@keyframes pop{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}.visual{height:100%;min-height:0;display:flex;align-items:center;justify-content:center}.visual svg{width:100%;height:100%;max-height:100%;filter:drop-shadow(0 8px 15px #1d1d1f10)}.diagram{transform-origin:center;animation:float 4s ease-in-out infinite alternate}@keyframes float{from{transform:translateY(4px)}to{transform:translateY(-5px)}}.foot{display:flex;justify-content:space-between;font-size:12px;color:#86868b;font-weight:650}.bottom{height:115px;flex:none;background:#ffffffd9;border-top:1px solid #e5e5ea;backdrop-filter:blur(20px);padding:9px 20px 12px}.controls{display:flex;align-items:center;justify-content:space-between;height:35px;gap:12px}.btn{border:0;background:#007aff;color:#fff;border-radius:12px;padding:7px 15px;font-weight:700;cursor:pointer}.btn.secondary{background:#e9f1ff;color:#007aff}.strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin;padding:6px 2px 4px}.thumb{border:1px solid #d9dce2;background:white;color:#666;border-radius:9px;min-width:47px;height:38px;cursor:pointer;font-size:12px;font-weight:800}.thumb.active{background:#007aff;border-color:#007aff;color:#fff}.thumb.pair{border-bottom:3px solid #a78bfa}.level{display:inline-flex;background:#eaf3ff;color:#007aff;padding:8px 15px;border-radius:99px;font-weight:800;font-size:13px;letter-spacing:.07em}.level.advanced{background:#f0e9ff;color:#8b5cf6}.badgebar{display:flex;gap:8px;align-items:center}.counter{font-variant-numeric:tabular-nums}.progress{position:absolute;bottom:0;left:0;height:4px;background:#007aff;transition:width .35s}@media(max-width:800px){.top{height:55px}.stage{padding:4px}.slide{width:100%;border-radius:16px;padding:4%;}.title{font-size:clamp(19px,4.5vw,35px)}.formula{font-size:clamp(14px,3vw,25px);padding:12px}.bottom{height:106px}.body{gap:1%}.brand{font-size:14px}.info{font-size:10px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Анимация физических схем: векторы проявляются последовательно; движение объектов различается по теме. */
.visual svg{overflow:visible}
.diagram{animation:none;transform-origin:50% 50%}
.force-arrow{stroke-dasharray:520;stroke-dashoffset:520;animation:drawForce 1.15s cubic-bezier(.2,.8,.2,1) forwards}
.force-arrow:nth-of-type(2n){animation-delay:.35s}
.force-arrow:nth-of-type(3n){animation-delay:.65s}
.force-label{opacity:0;animation:showLabel .6s ease forwards .85s}
@keyframes drawForce{to{stroke-dashoffset:0}}
@keyframes showLabel{to{opacity:1}}
@keyframes gentleSway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes orbitalMotion{from{offset-distance:0%}to{offset-distance:100%}}
@keyframes bob{0%,100%{transform:translateX(-10px)}50%{transform:translateX(10px)}}
@keyframes buoyancy{0%,100%{transform:translateY(7px)}50%{transform:translateY(-9px)}}
@keyframes pulseLine{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes traceGraph{from{stroke-dashoffset:1300}to{stroke-dashoffset:0}}
.diagram.kind-pendulum>path:nth-child(2){transform-origin:310px 70px;animation:gentleSway 3.4s ease-in-out infinite}
.diagram.kind-osc>rect{animation:bob 2.2s ease-in-out infinite}
.diagram.kind-fluid>rect{animation:buoyancy 3s ease-in-out infinite}
.diagram.kind-resonance>path:nth-child(2){stroke-dasharray:1300;stroke-dashoffset:1300;animation:traceGraph 2.8s ease forwards}
/* Орбитальное движение задаётся SVG animateMotion внутри спутника. */
.diagram.kind-circuit>text{animation:pulseLine 2s ease-in-out infinite}
.diagram.kind-transformer>text{animation:pulseLine 2.3s ease-in-out infinite alternate}
@media(prefers-reduced-motion:reduce){.force-arrow{stroke-dashoffset:0}.force-label{opacity:1}}

/* Читаемая композиция: текст и иллюстрация в независимых колонках. */
.slide{container-type:size;isolation:isolate;padding:clamp(20px,2.7cqw,43px) clamp(24px,3.6cqw,60px);gap:clamp(8px,1.2cqh,16px)}
.badgebar{flex:none;min-height:0;flex-wrap:wrap;gap:8px}
.over{font-size:clamp(12px,1.38cqw,20px);line-height:1.2;letter-spacing:.08em}
.level{font-size:clamp(12px,1.15cqw,17px);padding:6px 12px;line-height:1.25}
.title{flex:none;font-size:clamp(27px,3.35cqw,58px);line-height:1.12;letter-spacing:-.04em;margin:0;max-width:100%;overflow-wrap:break-word;text-wrap:balance}
.body{display:grid;grid-template-columns:minmax(0,0.95fr) minmax(0,1.2fr);gap:clamp(14px,2.6cqw,40px);min-width:0;min-height:0;flex:1;align-items:stretch;overflow:hidden}
.formulas{min-width:0;min-height:0;align-self:center;display:flex;flex-direction:column;justify-content:center;gap:clamp(8px,1.5cqh,17px);overflow:hidden;z-index:2}
.formula{font-size:clamp(24px,2.8cqw,46px);line-height:1.23;padding:clamp(12px,1.7cqw,23px);border-radius:clamp(13px,1.7cqw,24px);overflow-wrap:anywhere;word-break:normal;min-width:0;max-width:100%;white-space:normal}
.visual{position:relative;min-width:0;min-height:0;width:100%;height:100%;overflow:hidden;z-index:1}
.visual svg{display:block;width:100%;height:100%;max-width:100%;max-height:100%;overflow:hidden;object-fit:contain}
.foot{flex:none;font-size:clamp(11px,1.1cqw,16px);line-height:1.3;gap:15px}
@container (max-height:460px){.slide{gap:5px;padding-top:18px;padding-bottom:15px}.title{font-size:clamp(22px,3cqw,43px)}.formula{font-size:clamp(19px,2.5cqw,35px);padding:10px 13px}.over{font-size:12px}.level{font-size:11px;padding:4px 9px}}
@container (max-width:640px){.slide{padding:14px 18px;gap:5px}.title{font-size:clamp(18px,3.3cqw,26px)}.body{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:8px}.formula{font-size:clamp(15px,2.9cqw,22px);padding:9px 10px;border-radius:11px}.over{font-size:10px}.level{font-size:10px;padding:4px 8px}.foot{font-size:9px}}
@media(max-width:800px){.stage{padding:5px}.slide{width:min(100%,calc((100dvh - 180px)*1.777));aspect-ratio:16/9}.bottom{height:106px}}

/* Условия задач: отдельная область без наложения на схему. */
.formulas:has(.condition){justify-content:center;gap:clamp(8px,1cqh,12px);overflow-y:auto;scrollbar-width:thin;align-self:stretch}
.condition{background:#eaf3ff;border:1px solid #d5e5ff;border-radius:17px;padding:clamp(10px,1.2cqw,18px);font-size:clamp(15px,1.65cqw,25px);font-weight:560;line-height:1.28;overflow-wrap:break-word;flex-shrink:0}
.condition p{margin:6px 0 0}.condition-label{color:#0066cc;font-size:clamp(11px,.9cqw,14px);letter-spacing:.07em;font-weight:850}
.formulas:has(.condition) .formula{font-size:clamp(19px,2.15cqw,34px);padding:clamp(10px,1.1cqw,16px);flex-shrink:0}
.slide:has(.condition) .body{grid-template-columns:minmax(0,1.12fr) minmax(0,1fr)}
@container (max-height:460px){.condition{font-size:clamp(13px,1.35cqw,19px);padding:9px}.formulas:has(.condition) .formula{font-size:clamp(17px,1.85cqw,26px);padding:8px}}
@container (max-width:640px){.condition{font-size:clamp(11px,2.2cqw,15px);padding:7px}.condition-label{font-size:9px}.formulas:has(.condition) .formula{font-size:clamp(13px,2.3cqw,19px);padding:7px}}

/* Финальная версия: 44 экрана, крупная типографика и безопасные поля. */
.slide{padding:clamp(18px,2.2cqw,34px) clamp(22px,3cqw,48px);gap:clamp(5px,.8cqh,12px)}
.title{font-size:clamp(25px,3.0cqw,49px);line-height:1.08;max-width:100%}
.body{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(12px,2cqw,26px);overflow:hidden}
.slide:has(.condition) .body{grid-template-columns:minmax(0,1.13fr) minmax(0,1fr)}
.condition{font-size:clamp(16px,1.58cqw,24px);line-height:1.25;max-height:48%;overflow:auto;flex-shrink:1;min-height:0}
.formulas:has(.condition){overflow:hidden;justify-content:center}
.formulas:has(.condition) .formula{font-size:clamp(18px,2.03cqw,32px);line-height:1.17;overflow-wrap:anywhere;flex-shrink:1}
.formula{font-size:clamp(22px,2.5cqw,40px)}
.visual{overflow:hidden;isolation:isolate}
.visual svg{overflow:hidden}
.force-label{paint-order:stroke fill;stroke:#fff;stroke-width:9px;stroke-linejoin:round;dominant-baseline:middle}
.force-arrow{stroke-width:4.5px}
@container (max-height:460px){.title{font-size:clamp(22px,2.8cqw,40px)}.condition{font-size:clamp(13px,1.38cqw,20px);max-height:50%}.formulas:has(.condition) .formula{font-size:clamp(15px,1.85cqw,26px)}}
@container (max-width:640px){.title{font-size:clamp(17px,3cqw,25px)}.condition{font-size:clamp(11px,2.2cqw,15px)}.formulas:has(.condition) .formula{font-size:clamp(12px,2.25cqw,18px)}}

/* Дополнительные выводы: крупные, автономные экраны */
.slide.hero-slide{background:linear-gradient(115deg,#e7f4ff 0%,#fff 51%,#e9edff 100%);}
.hero-main{display:grid;grid-template-columns:1.08fr 1fr;gap:3%;flex:1;min-height:0;align-items:center}
.hero-copy{display:flex;flex-direction:column;gap:clamp(9px,1.4cqh,18px);z-index:2}
.hero-eyebrow{color:#0066cc;font-size:clamp(13px,1.5cqw,21px);font-weight:800;letter-spacing:.09em}
.hero-heading{font-size:clamp(32px,5.0cqw,77px);line-height:1.02;letter-spacing:-.06em;margin:0;color:#101d40}
.hero-heading em{font-style:normal;background:linear-gradient(100deg,#007aff,#7b44ff);background-clip:text;color:transparent}
.hero-sub{font-size:clamp(17px,2cqw,31px);font-weight:650;line-height:1.23;color:#45516b}
.hero-art{width:100%;height:100%;min-height:0;object-fit:cover;border-radius:clamp(16px,2.4cqw,34px);box-shadow:0 18px 45px #134aa130;animation:heroReveal 1.1s ease both}
.hero-chips{display:flex;gap:9px;flex-wrap:wrap}
.hero-chip{border-radius:99px;padding:8px 13px;background:#ffffffd9;border:1px solid #c9dfff;font-weight:750;color:#15519d;font-size:clamp(11px,1.05cqw,16px)}
@keyframes heroReveal{from{opacity:.25;transform:translateX(35px) scale(.94)}to{opacity:1;transform:none}}
.takeaway{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,2cqw,28px);align-content:center}
.take-card{background:linear-gradient(145deg,#f4f8ff,#fff);border:1px solid #e0eaff;border-radius:clamp(15px,2cqw,28px);padding:clamp(12px,2.2cqw,31px);display:flex;flex-direction:column;justify-content:center;gap:clamp(5px,1cqh,12px);min-width:0;animation:pop .7s both}
.take-card:nth-child(2){animation-delay:.12s}.take-card:nth-child(3){animation-delay:.24s}.take-card:nth-child(4){animation-delay:.36s}
.take-card .emoji{font-size:clamp(25px,3.3cqw,49px)}.take-card strong{font-size:clamp(17px,2.2cqw,33px);line-height:1.1;letter-spacing:-.025em}.take-card span{font-size:clamp(13px,1.45cqw,21px);line-height:1.3;color:#56617a}
.take-card:nth-child(2){background:linear-gradient(145deg,#f2edff,#fff);border-color:#e8dcff}.take-card:nth-child(3){background:linear-gradient(145deg,#eafbf7,#fff);border-color:#c8f2e8}.take-card:nth-child(4){background:linear-gradient(145deg,#fff4e9,#fff);border-color:#ffead0}
.steps-grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:clamp(9px,1.4cqw,20px)}
.step-card{background:#f5f8ff;border:1px solid #e3e9f5;border-radius:clamp(13px,1.8cqw,25px);padding:clamp(10px,1.6cqw,23px);display:flex;flex-direction:column;gap:clamp(5px,.9cqh,11px);justify-content:center;animation:pop .65s both;min-width:0}
.step-card:nth-child(2){animation-delay:.1s}.step-card:nth-child(3){animation-delay:.2s}.step-card:nth-child(4){animation-delay:.3s}.step-card:nth-child(5){animation-delay:.4s}.step-card:nth-child(6){animation-delay:.5s}
.step-number{font-size:clamp(14px,1.6cqw,23px);color:#007aff;font-weight:850}.step-card strong{font-size:clamp(16px,1.85cqw,28px);line-height:1.1}.step-card span{font-size:clamp(12px,1.35cqw,20px);line-height:1.28;color:#596477}
.final-panel{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:clamp(12px,2cqh,28px);background:radial-gradient(circle at 80% 20%,#e5d9ff,transparent 45%),radial-gradient(circle at 10% 80%,#d7f5ff,transparent 50%);border-radius:26px}
.final-panel .big{font-size:clamp(30px,4.7cqw,73px);font-weight:850;letter-spacing:-.05em;line-height:1.08;max-width:88%}.final-panel .small{font-size:clamp(16px,2.1cqw,32px);max-width:85%;color:#596477;line-height:1.35}
@container (max-height:460px){.hero-heading{font-size:clamp(26px,4.3cqw,62px)}.hero-sub{font-size:clamp(14px,1.7cqw,25px)}.take-card{padding:10px 16px}.take-card strong{font-size:clamp(15px,1.9cqw,25px)}.take-card span{font-size:clamp(11px,1.3cqw,17px)}.step-card{padding:8px 13px}.step-card strong{font-size:clamp(13px,1.6cqw,23px)}.step-card span{font-size:clamp(10px,1.15cqw,16px)}}

/* Contrast-coded task pairs */
.slide.basic-task{background:linear-gradient(115deg,#e7f5ff,#f7fcff 56%,#e9f4ff);}
.slide.advanced-task{background:linear-gradient(115deg,#f0e8ff,#fcfaff 58%,#efe6ff);}
.slide.basic-task .level{background:#0877d8!important;color:#fff!important;border-color:#0877d8!important}
.slide.advanced-task .level{background:#7542d9!important;color:#fff!important;border-color:#7542d9!important}
.slide.basic-task .condition{background:#f3faff;border-color:#b7dcff}
.slide.advanced-task .condition{background:#f8f3ff;border-color:#d9c5ff}
.slide.basic-task .visual{background:linear-gradient(140deg,#f7fcff,#ddecff)}
.slide.advanced-task .visual{background:linear-gradient(140deg,#fbf7ff,#eee2ff)}
.thumb.basic-thumb{border-bottom:4px solid #1685ef!important}
.thumb.advanced-thumb{border-bottom:4px solid #8a55e8!important}
/* Portrait intro slide */
.slide.portrait-slide{background:radial-gradient(circle at 65% 30%,#dfeaff,transparent 45%),linear-gradient(125deg,#fff,#f4f8ff)}
.portrait-layout{flex:1;min-height:0;display:grid;grid-template-columns:1.12fr .88fr;gap:3%;align-items:center}
.portrait-copy{display:flex;flex-direction:column;gap:clamp(12px,2cqh,28px);min-width:0}
.portrait-kicker{font-size:clamp(14px,1.35cqw,21px);font-weight:800;color:#0877d8;letter-spacing:.07em}
.portrait-heading{font-size:clamp(32px,4.2cqw,66px);font-weight:850;line-height:1.05;letter-spacing:-.045em;color:#152544}
.portrait-heading em{font-style:normal;color:#007aff}
.portrait-line{font-size:clamp(17px,2.1cqw,32px);font-weight:650;color:#52627a;line-height:1.25}
.portrait-photo-wrap{height:95%;min-height:0;max-height:100%;border-radius:clamp(20px,3cqw,42px);overflow:hidden;position:relative;box-shadow:0 24px 60px #154c9033;animation:portraitArrive 1.2s cubic-bezier(.2,.7,.2,1) both}
.portrait-photo{width:100%;height:100%;object-fit:cover;object-position:center 32%;display:block}
.portrait-photo-wrap:after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,#0787ff28,transparent 50%,#8d52ff19);mix-blend-mode:screen}
.portrait-orbit{position:absolute;inset:12% -17%;border:3px solid #ffffffa0;border-radius:50%;transform:rotate(-28deg);animation:orbitGlow 7s linear infinite;pointer-events:none}
.portrait-orbit:after{content:'✦';position:absolute;top:0;left:49%;font-size:32px;color:#fff;text-shadow:0 0 16px #007aff}
@keyframes portraitArrive{from{opacity:0;transform:translateX(75px) scale(.92);filter:blur(14px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes orbitGlow{0%{transform:rotate(-28deg)}100%{transform:rotate(332deg)}}
/* 43 vivid finale of learning */
.slide.values-bright{background:radial-gradient(circle at 15% 15%,#b4e9ff,transparent 40%),radial-gradient(circle at 85% 70%,#e0c5ff,transparent 40%),linear-gradient(130deg,#f0f9ff,#f6f0ff)}
.values-layout{flex:1;min-height:0;display:grid;grid-template-columns:1.1fr .9fr;gap:3%;align-items:center}
.values-headline{font-size:clamp(28px,3.5cqw,54px);line-height:1.08;font-weight:850;letter-spacing:-.045em}
.values-points{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,1.4cqw,20px);margin-top:clamp(15px,2cqh,27px)}
.values-pill{background:#ffffffd9;border:1px solid #fff;border-radius:20px;padding:clamp(11px,1.5cqw,22px);font-size:clamp(13px,1.5cqw,22px);font-weight:750;box-shadow:0 9px 24px #2857a015;animation:pop .7s both}
.values-pill span{font-size:clamp(24px,2.6cqw,38px);display:block;margin-bottom:6px}
.values-art{height:95%;min-height:0;display:grid;grid-template-rows:1fr 1fr;gap:12px}
.values-art-panel{border-radius:25px;position:relative;overflow:hidden;background:linear-gradient(135deg,#007aff,#7349ff);display:flex;align-items:center;justify-content:center;box-shadow:0 18px 40px #325fc42c}
.values-art-panel:nth-child(2){background:linear-gradient(135deg,#16b9c9,#1472d7)}
.values-art-panel .giant{font-size:clamp(65px,9cqw,145px);filter:drop-shadow(0 14px 10px #0003);animation:floatValue 4s ease-in-out infinite}
.values-art-panel:nth-child(2) .giant{animation-delay:-2s}
.values-art-panel .art-caption{position:absolute;bottom:13px;left:18px;color:white;font-size:clamp(12px,1.3cqw,20px);font-weight:750}
@keyframes floatValue{50%{transform:translateY(-13px) rotate(4deg)}}
/* Channel QR end card */
.slide.channels-slide{background:radial-gradient(circle at 12% 18%,#c6e9ff,transparent 39%),radial-gradient(circle at 88% 20%,#dfd1ff,transparent 40%),linear-gradient(130deg,#f7fbff,#f9f6ff)}
.channel-head{text-align:center;flex-shrink:0;animation:pop .8s both}
.channel-eyebrow{color:#0877d8;font-size:clamp(12px,1.2cqw,18px);font-weight:850;letter-spacing:.16em}
.channel-title{font-size:clamp(38px,5.1cqw,82px);line-height:1.08;font-weight:900;letter-spacing:-.055em;background:linear-gradient(90deg,#007aff,#7650ef,#00a9bb);background-size:220%;color:transparent;background-clip:text;animation:shimmer 5s linear infinite}
@keyframes shimmer{to{background-position:220% 0}}

const inkBySlide=new Map();let inkEnabled=false,inkColor='#ff3b30',inkSize=3,inkDrawing=null;
const inkToggle=document.getElementById('inkToggle'),inkSizeEl=document.getElementById('inkSize'),inkColorEl=document.getElementById('inkColor');
function strokes(){if(!inkBySlide.has(current))inkBySlide.set(current,[]);return inkBySlide.get(current)}
function canvasDims(c){const r=c.getBoundingClientRect();return {w:r.width,h:r.height}}
function repaintInk(){const c=document.getElementById('inkCanvas');if(!c)return;const {w,h}=canvasDims(c);if(!w||!h)return;const dpr=Math.min(window.devicePixelRatio||1,2);const pw=Math.round(w*dpr),ph=Math.round(h*dpr);if(c.width!==pw||c.height!==ph){c.width=pw;c.height=ph}const ctx=c.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);for(const stroke of strokes()){const pts=stroke.points;if(!pts.length)continue;ctx.beginPath();ctx.strokeStyle=stroke.color;ctx.fillStyle=stroke.color;ctx.lineWidth=stroke.width;ctx.lineCap='round';ctx.lineJoin='round';ctx.moveTo(pts[0][0]*w,pts[0][1]*h);if(pts.length===1){ctx.arc(pts[0][0]*w,pts[0][1]*h,stroke.width/2,0,Math.PI*2);ctx.fill();continue}for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0]*w,pts[i][1]*h);ctx.stroke()}}
function inkPoint(e,c){const r=c.getBoundingClientRect();return [Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))]}
function setupInkCanvas(){const slide=document.getElementById('slide');let c=document.getElementById('inkCanvas');if(!c){c=document.createElement('canvas');c.id='inkCanvas';c.setAttribute('aria-label','Поле для рисования');slide.appendChild(c)}slide.classList.toggle('ink-active',inkEnabled);c.addEventListener('pointerdown',e=>{if(!inkEnabled)return;e.preventDefault();c.setPointerCapture(e.pointerId);inkDrawing={color:inkColor,width:inkSize,points:[inkPoint(e,c)]};strokes().push(inkDrawing);repaintInk()});c.addEventListener('pointermove',e=>{if(!inkDrawing)return;e.preventDefault();inkDrawing.points.push(inkPoint(e,c));repaintInk()});const end=()=>{inkDrawing=null;updateInkButtons()};c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);requestAnimationFrame(repaintInk);updateInkButtons()}
function updateInkButtons(){inkToggle.classList.toggle('on',inkEnabled);inkToggle.textContent=inkEnabled?'✓ Рисование':'✎ Рисовать';document.getElementById('inkUndo').disabled=!strokes().length;document.getElementById('inkClear').disabled=!strokes().length}
inkToggle.addEventListener('click',()=>{inkEnabled=!inkEnabled;document.getElementById('slide').classList.toggle('ink-active',inkEnabled);updateInkButtons()});
inkSizeEl.addEventListener('input',()=>{inkSize=Number(inkSizeEl.value);document.getElementById('inkSizeLabel').textContent=inkSize});
function chooseColor(color){inkColor=color;inkColorEl.value=color;document.querySelectorAll('[data-ink-color]').forEach(b=>b.classList.toggle('chosen',b.dataset.inkColor.toLowerCase()===color.toLowerCase()))}
inkColorEl.addEventListener('input',()=>chooseColor(inkColorEl.value));document.querySelectorAll('[data-ink-color]').forEach(b=>b.addEventListener('click',()=>chooseColor(b.dataset.inkColor)));
document.getElementById('inkUndo').addEventListener('click',()=>{strokes().pop();repaintInk();updateInkButtons()});
document.getElementById('inkClear').addEventListener('click',()=>{inkBySlide.set(current,[]);repaintInk();updateInkButtons()});
window.addEventListener('resize',()=>requestAnimationFrame(repaintInk));

 const taskSvg=el.querySelector('.visual svg');
 if(taskSvg){taskSvg.setAttribute('viewBox','0 0 650 530');taskSvg.setAttribute('preserveAspectRatio','xMidYMid meet');}
}adjustForceLabels();setupInkCanvas();document.getElementById('count').textContent=`${current+1} / ${SLIDES.length}`;[...strip.children].forEach((b,i)=>b.classList.toggle('active',i===current));strip.children[current].scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});history.replaceState(null,'','#slide-'+(current+1))}function go(i){current=Math.max(0,Math.min(SLIDES.length-1,i));render()}document.getElementById('prev').onclick=()=>go(current-1);document.getElementById('next').onclick=()=>go(current+1);document.getElementById('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();document.addEventListener('keydown',e=>{if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();go(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}if(e.key.toLowerCase()==='f')document.getElementById('full').click()});go(Math.max(0,Math.min(SLIDES.length-1,(parseInt(location.hash.replace('#slide-',''))||1)-1)));</script></body></html>
